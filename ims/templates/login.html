<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود — سامانه مدیریت انبار</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/logo.jpg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body>
  <div class="login-page">
    <div class="card login-card">
      <div class="login-brand">
        <img class="login-logo" src="{{ url_for('static', filename='img/logo.jpg') }}" alt="لوگوی سازمان">
        <div>
          <h1 style="font-size:1.22rem;">ورود به سامانه مدیریت انبار</h1>
          <p class="text-muted" style="font-size:0.86rem;margin-top:2px;">سامانه داخلی کنترل موجودی و قطعات</p>
        </div>
      </div>

      <div id="login-error" class="alert alert-danger hidden" style="margin-bottom:14px;"></div>

      <form id="login-form" style="display:flex;flex-direction:column;gap:14px;">
        <div class="field">
          <label for="user_name">نام کاربری</label>
          <input id="user_name" name="user_name" class="input ltr" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">رمز عبور</label>
          <input id="password" name="password" class="input ltr" type="password" autocomplete="current-password" required>
        </div>
        <button id="login-submit" type="submit" class="btn btn-primary" style="margin-top:4px;">ورود به سامانه</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { apiFetch } from "{{ url_for('static', filename='js/api.js') }}";
    import { translateServerError } from "{{ url_for('static', filename='js/ui.js') }}";

    const form = document.getElementById("login-form");
    const errBox = document.getElementById("login-error");
    const submitBtn = document.getElementById("login-submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "در حال ورود...";

      try {
        await apiFetch("/api/auth/login", {
          method: "POST",
          body: {
            user_name: document.getElementById("user_name").value,
            password: document.getElementById("password").value,
          },
        });
        const params = new URLSearchParams(window.location.search);
        const nextUrl = params.get("next") || "/";
        window.location.href = nextUrl.startsWith("/") ? nextUrl : "/";
      } catch (err) {
        errBox.textContent = translateServerError(err.message);
        errBox.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "ورود به سامانه";
      }
    });
  </script>
</body>
</html>
